<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCPC Timeline · Interactive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #f4f7fc;
      color: #1a2b3e;
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timeline-container {
      max-width: 1000px;
      width: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
      padding: 2.5rem 2rem;
      border: 1px solid #d9e2ef;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #0a1e2f;
      border-left: 7px solid #2a6f97;
      padding-left: 1.2rem;
      margin-bottom: 2rem;
      line-height: 1.2;
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    /* each item */
    .timeline-item {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #dde6f0;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .timeline-item:hover {
      border-color: #b8cee4;
      box-shadow: 0 4px 10px -6px rgba(0, 40, 80, 0.2);
    }

    /* clickable title row */
    .event-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 1rem;
      padding: 1.1rem 1.5rem;
      cursor: pointer;
      user-select: none;
      border-radius: 16px;
      background: #ffffff;
      transition: background 0.1s;
    }

    .event-header:hover {
      background: #f9fcff;
    }

    .event-date {
      font-weight: 700;
      font-size: 1.05rem;
      color: #1f4a6e;
      letter-spacing: -0.2px;
      min-width: 120px;
      flex-shrink: 0;
    }

    .event-title {
      font-weight: 500;
      font-size: 1.1rem;
      color: #0d2a40;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .event-title::after {
      content: "▼";
      font-size: 0.75rem;
      color: #7a9bb8;
      margin-left: 1rem;
      transition: transform 0.2s;
    }

    .timeline-item.expanded .event-title::after {
      transform: rotate(180deg);
    }

    /* description panel */
    .event-description {
      display: none;
      padding: 0.9rem 1.5rem 1.5rem 1.5rem;
      border-top: 1px dashed #cbdae9;
      margin: 0 1px;
      color: #1d3349;
      font-size: 0.98rem;
    }

    .timeline-item.expanded .event-description {
      display: block;
    }

    .event-description p {
      margin-bottom: 0.9rem;
    }

    .event-description p:last-child {
      margin-bottom: 0;
    }

    .event-description ul {
      margin: 0.6rem 0 0.8rem 1.5rem;
      padding-left: 0.2rem;
    }

    .event-description li {
      margin-bottom: 0.45rem;
      padding-left: 0.2rem;
    }

    .event-description li:last-child {
      margin-bottom: 0;
    }

    /* email link */
    .email-link {
      color: #1f6e9c;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: color 0.1s;
      background: none;
      border: none;
      font-size: inherit;
      font-family: inherit;
      padding: 0;
      margin: 0;
      display: inline;
    }

    .email-link:hover {
      color: #0b3b5c;
      text-decoration-thickness: 2px;
    }

    /* popup overlay */
    .pdf-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .pdf-overlay.active {
      display: flex;
    }

    .pdf-modal {
      background: #fff;
      width: 90%;
      max-width: 1100px;
      height: 85vh;
      border-radius: 24px;
      box-shadow: 0 30px 50px -12px black;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeSlide 0.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0.7; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .pdf-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.6rem;
      background: #eef3f9;
      border-bottom: 1px solid #c7d9eb;
    }

    .pdf-modal-header h3 {
      font-weight: 500;
      font-size: 1.1rem;
      color: #12344f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80%;
    }

    .pdf-close-btn {
      background: none;
      border: none;
      font-size: 1.9rem;
      line-height: 1;
      cursor: pointer;
      color: #2e4f6e;
      padding: 0 0.4rem;
      transition: color 0.1s;
      font-weight: 300;
    }

    .pdf-close-btn:hover {
      color: #b22222;
    }

    .pdf-iframe-container {
      flex: 1;
      background: #dfe8f2;
      overflow: hidden;
    }

    .pdf-iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .pdf-hint {
      font-size: 0.8rem;
      color: #5b7f9c;
      background: #f0f5fb;
      padding: 0.4rem 1.6rem;
      border-top: 1px solid #c7d9eb;
      text-align: right;
    }

    /* small screens */
    @media (max-width: 650px) {
      .timeline-container { padding: 1.6rem 1rem; }
      h1 { font-size: 1.7rem; padding-left: 0.8rem; }
      .event-header { flex-direction: column; align-items: flex-start; gap: 0.25rem; padding: 1rem 1.2rem; }
      .event-date { font-size: 0.95rem; }
      .event-title { font-size: 1rem; width: 100%; }
      .event-description { padding: 1rem 1.2rem 1.3rem; }
      .pdf-modal { width: 98%; height: 90vh; }
    }
  </style>
</head>
<body>

<div class="timeline-container">
  <h1>📋 VCPC · Timeline of Facts and Events</h1>
  <div class="timeline-list" id="timelineList">
    <!-- data injected by javascript -->
  </div>
</div>

<!-- PDF POPUP OVERLAY -->
<div class="pdf-overlay" id="pdfOverlay">
  <div class="pdf-modal">
    <div class="pdf-modal-header">
      <h3 id="pdfTitle">Email / Document</h3>
      <button class="pdf-close-btn" id="closePdfBtn" aria-label="Close PDF">&times;</button>
    </div>
    <div class="pdf-iframe-container">
      <iframe id="pdfFrame" src="about:blank" title="PDF document viewer"></iframe>
    </div>
    <div class="pdf-hint">📄 PDF opens from the same folder as this HTML file</div>
  </div>
</div>

		<li><a href="#" class="email-link" data-pdf="10-05-Report of Procedure Failure by Presbytery of Westminster and VCPC Session.pdf">Click here to read the Email to Synod of British Columbia</a>.</li>

  // --------------------------------------------------------------
  // RENDER TIMELINE
  // --------------------------------------------------------------
  const listEl = document.getElementById('timelineList');

  function renderTimeline() {
    listEl.innerHTML = '';
    timelineData.forEach((item, index) => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'timeline-item';
      itemDiv.dataset.index = index;

      // header (date + title) — clickable
      const header = document.createElement('div');
      header.className = 'event-header';

      const dateSpan = document.createElement('span');
      dateSpan.className = 'event-date';
      dateSpan.textContent = item.date;

      const titleSpan = document.createElement('span');
      titleSpan.className = 'event-title';
      titleSpan.textContent = item.title;

      header.appendChild(dateSpan);
      header.appendChild(titleSpan);

      // description
      const descDiv = document.createElement('div');
      descDiv.className = 'event-description';
      descDiv.innerHTML = item.description;  // includes <ul>, <li>, and <a> links

      // toggle expand/collapse
      header.addEventListener('click', (e) => {
        // if the click is on a link inside the title (none), ignore
        if (e.target.closest('a')) return;
        itemDiv.classList.toggle('expanded');
      });

      itemDiv.appendChild(header);
      itemDiv.appendChild(descDiv);
      listEl.appendChild(itemDiv);
    });

    // attach PDF link handlers after render
    attachPdfHandlers();
  }

  // --------------------------------------------------------------
  // PDF POPUP logic
  // --------------------------------------------------------------
  const overlay = document.getElementById('pdfOverlay');
  const pdfFrame = document.getElementById('pdfFrame');
  const pdfTitle = document.getElementById('pdfTitle');
  const closeBtn = document.getElementById('closePdfBtn');

  function openPdf(filename) {
    if (!filename) return;
    // assume PDFs are in same folder as HTML
    pdfFrame.src = filename;
    pdfTitle.textContent = filename;
    overlay.classList.add('active');
  }

  function closePdf() {
    overlay.classList.remove('active');
    pdfFrame.src = 'about:blank'; // clear
    pdfTitle.textContent = 'Email / Document';
  }

  // close on X button, overlay click, or ESC
  closeBtn.addEventListener('click', closePdf);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closePdf();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('active')) {
      closePdf();
    }
  });

  // attach click handlers to all .email-link elements (with data-pdf)
  function attachPdfHandlers() {
    document.querySelectorAll('.email-link').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();          // prevent page jump
        e.stopPropagation();        // avoid toggling the timeline item
        const pdfFile = this.dataset.pdf;
        if (pdfFile) {
          openPdf(pdfFile);
        } else {
          openPdf('email.pdf');     // fallback
        }
      });
    });
  }

  // initial render
  renderTimeline();
</script>

</body>
</html>
